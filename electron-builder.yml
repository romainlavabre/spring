appId: com.romainlavabre.spring
productName: Spring
executableName: spring
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
# Run by the app to install an update of its AppImage.
extraResources:
  - install.sh
asarUnpack:
  - '**/*.node'
linux:
  target:
    - AppImage
    - deb
  category: Office
  syncDesktopName: true
  icon: build/icon.png
  maintainer: Romain Lavabre
  synopsis: Beautiful documentation kept in git workspaces
deb:
  # "spring" is taken in the Ubuntu archive (the Spring RTS engine).
  packageName: spring-doc
  depends:
    - git
    - openssh-client
  # Takes over from the packages published as "spring" up to 1.0.4. Bounded
  # below 2 so that the Ubuntu package (106.x) is left alone.
  fpm:
    - --conflicts
    - spring (<< 2)
    - --replaces
    - spring (<< 2)
artifactName: ${name}-${version}-${arch}.${ext}
